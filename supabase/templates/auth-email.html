<body style="margin:0;padding:0;background:#0d0d0d;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d0d0d;">
    <tr>
      <td align="center" style="padding:40px 12px;">
        <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="max-width:440px;width:100%;">
          <tr>
            <td style="padding:0 0 14px;">
              <span style="display:inline-block;background:#b41313;color:#fcfcfc;font-family:'Courier New',Courier,monospace;font-weight:bold;font-size:18px;letter-spacing:4px;padding:10px 14px;border:3px solid #fcfcfc;">BAIN</span>
              <span style="display:inline-block;color:#f8d800;font-family:'Courier New',Courier,monospace;font-weight:bold;font-size:15px;letter-spacing:3px;padding:10px 4px;">ON&nbsp;THE&nbsp;BEACH</span>
            </td>
          </tr>
          <tr>
            <td style="background:#fcfcfc;border:3px solid #0d0d0d;box-shadow:8px 8px 0 #b41313;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:22px 20px 0;font-family:'Courier New',Courier,monospace;color:#0d0d0d;font-size:15px;font-weight:bold;">
                    Your code:
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:12px 20px;">
                    <div style="background:#f0d890;border:3px dashed #0d0d0d;padding:16px 8px;font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:bold;letter-spacing:10px;color:#0d0d0d;">{{ .Token }}</div>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:2px 20px 4px;font-family:'Courier New',Courier,monospace;font-size:13px;color:#0d0d0d;">
                    or
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:8px 20px 24px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#b41313;color:#fcfcfc;font-family:'Courier New',Courier,monospace;font-weight:bold;font-size:14px;letter-spacing:2px;text-decoration:none;padding:14px 22px;border:3px solid #0d0d0d;">ENTER&nbsp;THE&nbsp;BEACH&nbsp;&gt;&gt;</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 4px 0;font-family:'Courier New',Courier,monospace;font-size:14px;color:#00e8d8;letter-spacing:3px;">
              &asymp;&asymp;&asymp;&asymp;&asymp;&asymp;&asymp;&asymp;&asymp;&asymp;&asymp;&asymp;
            </td>
          </tr>
          <tr>
            <td style="padding:10px 4px 0;font-family:'Courier New',Courier,monospace;font-size:12px;color:#d8b860;">
              Expires in an hour. Did not ask for this? Ignore it and stay on the mainland.
            </td>
          </tr>
          <tr>
            <td style="padding:8px 4px 0;font-family:'Courier New',Courier,monospace;font-size:11px;color:#6a6a6a;">
              Unofficial and just for fun.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
